[package]
name = "pm-mixer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pm-formats = { version = "0.1.0", path = "../pm-formats" }
# symphonia: same version as pm-analysis, but decoded here with the channels kept (pm-analysis
# only returns a mono mix-down). vorbis_rs: Ogg Vorbis encoder (BSD-3, vendored libvorbis C
# sources built by the cc crate, no system libraries).
symphonia = { version = "0.6.1", features = ["all"] }
vorbis_rs = "0.5.6"
# flac-codec: FLAC encoder with streaming writer and tag/picture blocks (pure Rust, MIT/Apache-2.0).
# mp3lame-encoder: LAME 4.0 (LGPL) vendored and built by the cc crate, no system libraries.
flac-codec = "1.3.3"
mp3lame-encoder = "0.3.0"
