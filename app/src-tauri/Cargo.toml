[package]
name = "pacemaker-revival"
version = "0.1.0"
description = "Open-source editor for the Tonium Pacemaker DJ device"
license = "GPL-3.0-or-later"
repository = "https://github.com/neavesj88/pacemaker-re"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pacemaker_revival_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: the player streams device audio into an <audio> element over asset://
# (scope is empty by default; playback allows the open library's files at run time).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri-plugin-dialog = "2"
pm-formats = { version = "0.1.0", path = "../../crates/pm-formats" }
pm-analysis = { version = "0.1.0", path = "../../crates/pm-analysis" }
pm-mixer = { version = "0.1.0", path = "../../crates/pm-mixer" }
lofty = "0.25.5"
# audio payload fingerprint of the tag writer (already in the build through tauri; MIT / Apache-2.0)
sha2 = "0.10"
# stem separation (S1). ort feature: HTDemucs through ONNX Runtime, loaded at run time.
pm-stems = { version = "0.1.0", path = "../../crates/pm-stems", features = ["ort"] }
# ureq + zip (and sha2 above): the consent-gated download of the model / onnxruntime (https, SHA-256 checked,
# the onnxruntime zip unpacked); nothing else in the app uses the network
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# Audio output of the live mix player (WASAPI, shared mode). Already in the build through tauri
# (same 0.62 line, MIT / Apache-2.0); cpal is not in the offline crate registry.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Threading"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort): a codec panic while analysing one file must not take the app down
strip = true

# The live mix engine renders on a worker thread against a ~90 ms deadline; unoptimised DSP misses it
# (an edit while playing broke the audio in debug builds). Optimise the DSP crates in dev builds too.
[profile.dev.package.pm-mixer]
opt-level = 3
[profile.dev.package.pm-formats]
opt-level = 3
