[package]
name = "pm-mixer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pm-formats = { version = "0.1.0", path = "../pm-formats" }
# symphonia: same version as pm-analysis, but decoded here with the channels kept (pm-analysis
# only returns a mono mix-down). vorbis_rs: Ogg Vorbis encoder (BSD-3, vendored libvorbis C
# sources built by the cc crate, no system libraries).
symphonia = { version = "0.6.1", features = ["all"] }
vorbis_rs = "0.5.6"
