<text x="569.0" y="320" font-size="12" fill="#6b6b6b">Top view, one scale. Sizes are about; the drive's</text>
<text x="569.0" y="338" font-size="12" fill="#6b6b6b">far (left) edge is not in the photo, drawn straight.</text>
