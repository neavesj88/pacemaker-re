[package]
name = "pacemaker-revival"
version = "0.1.0"
description = "Open-source editor for the Tonium Pacemaker DJ device"
license = "GPL-3.0-or-later"
repository = "https://github.com/neavesj88/pacemaker-re"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pacemaker_revival_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: the player streams device audio into an <audio> element over asset://
# (scope is empty by default; playback allows the open library's files at run time).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri-plugin-dialog = "2"
pm-formats = { version = "0.1.0", path = "../../crates/pm-formats" }
pm-analysis = { version = "0.1.0", path = "../../crates/pm-analysis" }
pm-mixer = { version = "0.1.0", path = "../../crates/pm-mixer" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort): a codec panic while analysing one file must not take the app down
strip = true
