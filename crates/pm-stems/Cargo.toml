[package]
name = "pm-stems"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vocal / instrumental stem separation: model-provider trait, STFT and overlap-add, stem writers"

[features]
default = []
# ONNX Runtime provider (HTDemucs). load-dynamic: nothing is linked or downloaded at build time,
# onnxruntime.dll is found at run time (see htdemucs.rs).
ort = ["dep:ort"]

[dependencies]
rustfft = "6.4.1"
# same encoder crate as pm-mixer (BSD-3, vendored libvorbis built by cc)
vorbis_rs = "0.5.6"
mp3lame-encoder = "0.3.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "cuda"], optional = true }

[dev-dependencies]
# decodes the written files back in the sink tests (same crate and version as pm-analysis / pm-mixer)
symphonia = { version = "0.6.1", features = ["all"] }
