[workspace]
resolver = "2"
members = ["crates/pm-formats", "crates/pm-analysis", "crates/pm-mixer", "crates/pm-bench", "crates/pm-cli", "crates/pm-stems"]
# the Tauri app is a separate project (own release profile with LTO; keeps bench builds fast)
exclude = ["app/src-tauri", ".claude"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/neavesj88/pacemaker-re"

# The live mix engine renders on a worker thread against a ~90 ms deadline; unoptimised DSP misses it
# (an edit while playing broke the audio in debug builds). Optimise the DSP crates in dev builds too.
[profile.dev.package.pm-mixer]
opt-level = 3
[profile.dev.package.pm-formats]
opt-level = 3
