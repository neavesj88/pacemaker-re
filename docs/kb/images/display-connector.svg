<text x="408" y="85" font-size="11.5" fill="#444">orange flex from the display, in connector 2</text>
<text x="392" y="106" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">2</tspan><tspan dx="8" font-weight="700">Display ZIF connector</tspan></text>
<text x="408" y="121" font-size="11.5" fill="#444">long white socket; lock bar on its left</text>
<text x="408" y="136" font-size="11.5" fill="#444">face. About 40 pins, 0.5 mm pitch: measure</text>
<text x="392" y="157" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">3</tspan><tspan dx="8" font-weight="700">Silkscreen pin numbers</tspan></text>
<text x="408" y="172" font-size="11.5" fill="#444">printed along the connector; 1 at the LIGHT+</text>
<text x="408" y="187" font-size="11.5" fill="#444">end</text>
<text x="392" y="208" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">4</tspan><tspan dx="8" font-weight="700">LIGHT- pad</tspan></text>
<text x="408" y="223" font-size="11.5" fill="#444">backlight, top end of the connector</text>
<text x="392" y="244" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">5</tspan><tspan dx="8" font-weight="700">LIGHT+ pad</tspan></text>
<text x="408" y="259" font-size="11.5" fill="#444">backlight, bottom end of the connector</text>
<text x="392" y="280" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">6</tspan><tspan dx="8" font-weight="700">Display module</tspan></text>
<text x="408" y="295" font-size="11.5" fill="#444">back of the display, under black tape</text>
<text x="392" y="316" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">7</tspan><tspan dx="8" font-weight="700">Second ZIF, flex 05B</tspan></text>
<text x="408" y="331" font-size="11.5" fill="#444">keypad / touch flex (not the display)</text>
<text x="392" y="352" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700" fill="#e0109a">8</tspan><tspan dx="8" font-weight="700">Test points</tspan></text>
<text x="408" y="367" font-size="11.5" fill="#444">HDD_EN, P_VIN, P_VBKUP (top); DVS_SWA,</text>
<text x="408" y="382" font-size="11.5" fill="#444">DVS_SWB, TP3, P_SW1, USB_EN (cluster right</text>
<text x="408" y="397" font-size="11.5" fill="#444">of LIGHT+)</text>
<line x1="392" y1="410" x2="684" y2="410" stroke="#ccc" stroke-width="1"/>
<text x="392" y="428" font-size="11.5" fill="#1a1a1a" font-weight="700">Display controller: Himax HX8347-A, 240 x 320.</text>
<text x="392" y="444" font-size="11.5" fill="#1a1a1a" font-weight="700">Backlight: fed from LIGHT+ / LIGHT-.</text>
<text x="392" y="460" font-size="11.5" fill="#666" font-weight="400">Traced from a photo, board turned upright. Proportions are</text>
<text x="392" y="476" font-size="11.5" fill="#666" font-weight="400">approximate; other parts omitted; dashed edges are cut off.</text>
